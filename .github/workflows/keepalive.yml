name: Streamlit keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Curl ping
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set +e
          BASE="${APP_URL:-https://wnt-gap-bot.streamlit.app}"
          BASE="${BASE%/}"
          URL="${BASE}/?ping=true"
          echo "curl $URL"
          BODY="$(curl -sS -L --max-time 25 -w "\n%{http_code}" "$URL" || true)"
          CODE="$(echo "$BODY" | tail -n1)"
          echo "http $CODE"
          exit 0
