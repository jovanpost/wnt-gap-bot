name: Streamlit keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Curl ping
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set +e
          BASE="${APP_URL:-https://wnt-gap-bot.streamlit.app}"
          BASE="${BASE%/}"
          URL="${BASE}/?ping=true"
          echo "curl $URL"
          CODE="$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 25 --max-redirs 0 \
            -A "Mozilla/5.0 wnt-gap-keepalive" \
            "$URL" || true)"
          echo "http $CODE"
          exit 0
